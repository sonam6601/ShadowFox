<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production RAG Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🤖 Production RAG Assistant</h1>
            <p>Upload a document and ask questions from it</p>
        </header>

        <!-- Upload Section -->
        <section class="card">
            <h2>📄 Upload Document</h2>

            <input type="file" id="fileInput" accept=".pdf">

            <button id="uploadBtn">Upload & Index</button>

            <p id="uploadStatus"></p>
        </section>

        <!-- Question Section -->
        <section class="card">
            <h2>💬 Ask a Question</h2>

            <textarea
                id="questionInput"
                placeholder="Ask something about your uploaded document..."
                rows="4"
            ></textarea>

            <button id="askBtn">Ask AI</button>

            <div id="answerBox"></div>
            <div id="sourcesBox"></div>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
